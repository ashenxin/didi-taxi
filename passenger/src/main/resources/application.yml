server:
  port: 8092

spring:
  application:
    name: passenger-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${ACCOUNT_LIFECYCLE_RESULT_GROUP:passenger-account-lifecycle-result-v1}
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/passenger?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      test-while-idle: true

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs/passenger-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/api/v2/spans

passenger:
  internal-auth:
    token: ${PASSENGER_INTERNAL_TOKEN:dev-passenger-internal-change-me}
  account-lifecycle:
    participant-token: ${ACCOUNT_LIFECYCLE_INTERNAL_TOKEN:dev-account-lifecycle-change-me}
    messaging:
      enabled: ${ACCOUNT_LIFECYCLE_KAFKA_ENABLED:true}
      command-topic: ${ACCOUNT_LIFECYCLE_COMMAND_TOPIC:account.lifecycle.command.v1}
      result-topic: ${ACCOUNT_LIFECYCLE_RESULT_TOPIC:account.lifecycle.result.v1}
      event-topic: ${ACCOUNT_LIFECYCLE_EVENT_TOPIC:account.lifecycle.event.v1}
    jobs:
      outbox:
        batch-size: ${ACCOUNT_LIFECYCLE_OUTBOX_BATCH_SIZE:50}
        send-timeout-seconds: ${ACCOUNT_LIFECYCLE_OUTBOX_SEND_TIMEOUT_SECONDS:5}
        batch-deadline-seconds: ${ACCOUNT_LIFECYCLE_OUTBOX_BATCH_DEADLINE_SECONDS:25}
        stale-processing-seconds: ${ACCOUNT_LIFECYCLE_OUTBOX_STALE_SECONDS:120}
      recovery:
        operation-batch-size: ${ACCOUNT_LIFECYCLE_RECOVERY_OPERATION_BATCH_SIZE:50}
        step-batch-size: ${ACCOUNT_LIFECYCLE_RECOVERY_STEP_BATCH_SIZE:50}
        batch-deadline-seconds: ${ACCOUNT_LIFECYCLE_RECOVERY_BATCH_DEADLINE_SECONDS:55}
    participants:
      order-base-url: ${ORDER_SERVICE_BASE_URL:http://127.0.0.1:8093}
      calculate-base-url: ${CALCULATE_SERVICE_BASE_URL:http://127.0.0.1:8091}
      wallet-base-url: ${WALLET_SERVICE_BASE_URL:http://127.0.0.1:8095}
      connect-timeout-ms: ${ACCOUNT_LIFECYCLE_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${ACCOUNT_LIFECYCLE_READ_TIMEOUT_MS:10000}
  admin:
    # 须与 admin-api 的 admin.security-context-cache.key-prefix 一致
    security-context-cache:
      key-prefix: ${ADMIN_SECURITY_CONTEXT_CACHE_KEY_PREFIX:adm:user:}
  app:
    customer-auth:
      sms:
        code-ttl-seconds: ${APP_SMS_CODE_TTL_SECONDS:300}
        min-interval-seconds: ${APP_SMS_MIN_INTERVAL_SECONDS:2}
        daily-limit-per-phone: ${APP_SMS_DAILY_LIMIT_PER_PHONE:100}
        daily-login-fail-limit-per-phone: ${APP_LOGIN_FAIL_DAILY_LIMIT_PER_PHONE:100}
        # 安全默认关闭；仅 local/dev profile 显式开启 mock 并返回验证码。
        mock-send-enabled: ${APP_SMS_MOCK_ENABLED:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

xxl:
  job:
    enabled: ${XXL_JOB_PASSENGER_ENABLED:true}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8081/xxl-job-admin}
    executor:
      appname: passenger-lifecycle-executor
      address: ${XXL_JOB_PASSENGER_EXECUTOR_ADDRESS:http://127.0.0.1:9995}
      port: 9995
      log-path: ./logs/xxl-job
      log-retention-days: 7

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.sx.passenger.dao: DEBUG

passenger:
  app:
    customer-auth:
      sms:
        min-interval-seconds: 2
        daily-limit-per-phone: 100
        daily-login-fail-limit-per-phone: 100
        mock-send-enabled: true

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.sx.passenger.dao: DEBUG

passenger:
  app:
    customer-auth:
      sms:
        min-interval-seconds: 2
        daily-limit-per-phone: 100
        daily-login-fail-limit-per-phone: 100
        mock-send-enabled: true
