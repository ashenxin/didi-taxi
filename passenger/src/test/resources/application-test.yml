spring:
  datasource:
    url: jdbc:h2:mem:passenger_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

passenger:
  internal-auth:
    token: test-passenger-internal-secret-32bytes

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
