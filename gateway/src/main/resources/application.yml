server:
  port: 18080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: admin-bff
          uri: http://127.0.0.1:8099
          predicates:
            - Path=/admin/**
        - id: passenger-bff
          uri: http://127.0.0.1:8100
          predicates:
            - Path=/app/**
        - id: driver-bff
          uri: http://127.0.0.1:8101
          predicates:
            - Path=/driver/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - 'http://localhost:*'
              - 'http://127.0.0.1:*'
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: '*'
            allowCredentials: false
            maxAge: 3600

gateway:
  jwt:
    # 本地 Postman / 前端无 token 联调时可设 false（或环境变量 GATEWAY_JWT_REQUIRE_AUTH=false）；生产必须为 true
    require-auth: ${GATEWAY_JWT_REQUIRE_AUTH:true}
    # 分端密钥：非 local/dev/test 环境必须分别显式配置，且不可相同。
    secret-admin: ${JWT_SECRET_ADMIN:}
    secret-app: ${JWT_SECRET_APP:}
    secret-driver: ${JWT_SECRET_DRIVER:}
    # 兼容字段仅用于检测并拒绝生产环境继续使用单一 JWT_SECRET。
    secret: ${JWT_SECRET:}
    audience-check-enabled: true
    audience-admin: admin-bff
    audience-app: app-bff
    audience-driver: driver-bff

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
