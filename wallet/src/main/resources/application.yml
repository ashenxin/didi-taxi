server:
  port: 8095

spring:
  profiles:
    default: local
  application:
    name: wallet-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wallet?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      test-while-idle: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

wallet:
  payment:
    mock:
      enabled: ${WALLET_PAYMENT_MOCK_ENABLED:true}
      auto-status: ${WALLET_PAYMENT_MOCK_AUTO_STATUS:SUCCESS}
      allowed-profiles: ${WALLET_PAYMENT_MOCK_ALLOWED_PROFILES:local,dev,test}
    checkout-minutes: ${WALLET_PAYMENT_CHECKOUT_MINUTES:10}
    checkout-token-secret: ${WALLET_PAYMENT_CHECKOUT_TOKEN_SECRET:local-dev-only-change-me}

services:
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://127.0.0.1:8093}

xxl:
  job:
    enabled: ${XXL_JOB_WALLET_ENABLED:true}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8081/xxl-job-admin}
    executor:
      appname: wallet-executor
      address: ${XXL_JOB_WALLET_EXECUTOR_ADDRESS:http://127.0.0.1:9997}
      port: 9997
      log-path: ./logs/xxl-job
      log-retention-days: 7
