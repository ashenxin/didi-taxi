server:
  port: 8095

spring:
  profiles:
    default: local
  application:
    name: wallet-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${ACCOUNT_LIFECYCLE_WALLET_GROUP:wallet-account-lifecycle-command-v1}
      auto-offset-reset: earliest
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wallet?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      test-while-idle: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

wallet:
  lifecycle:
    messaging:
      enabled: ${ACCOUNT_LIFECYCLE_KAFKA_ENABLED:true}
      command-topic: ${ACCOUNT_LIFECYCLE_COMMAND_TOPIC:account.lifecycle.command.v1}
      result-topic: ${ACCOUNT_LIFECYCLE_RESULT_TOPIC:account.lifecycle.result.v1}
      event-topic: ${ACCOUNT_LIFECYCLE_EVENT_TOPIC:account.lifecycle.event.v1}
    internal-auth:
      token: ${ACCOUNT_LIFECYCLE_INTERNAL_TOKEN:${ORDER_LIFECYCLE_INTERNAL_TOKEN:dev-wallet-lifecycle-change-me}}
    write-fence:
      mode: ${WALLET_LIFECYCLE_WRITE_FENCE_MODE:SHADOW}
  payment:
    mock:
      enabled: ${WALLET_PAYMENT_MOCK_ENABLED:true}
      auto-status: ${WALLET_PAYMENT_MOCK_AUTO_STATUS:SUCCESS}
      allowed-profiles: ${WALLET_PAYMENT_MOCK_ALLOWED_PROFILES:local,dev,test}
    checkout-minutes: ${WALLET_PAYMENT_CHECKOUT_MINUTES:10}
    checkout-token-secret: ${WALLET_PAYMENT_CHECKOUT_TOKEN_SECRET:local-dev-only-change-me}

services:
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://127.0.0.1:8093}

xxl:
  job:
    enabled: ${XXL_JOB_WALLET_ENABLED:true}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8081/xxl-job-admin}
    executor:
      appname: wallet-executor
      address: ${XXL_JOB_WALLET_EXECUTOR_ADDRESS:http://127.0.0.1:9997}
      port: 9997
      log-path: ./logs/xxl-job
      log-retention-days: 7
