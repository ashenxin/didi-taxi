server:
  port: 8100

# 经网关访问时不要开 BFF 自带 CORS（勿设 bff.browser-cors.enabled），与《网关服务_设计》一致。
# 仅浏览器直连本端口 8100 排障：bff.browser-cors.enabled=true

spring:
  application:
    name: passenger-api
app:
  jwt:
    # 与网关 gateway.jwt.secret-app 保持一致；非 local/dev/test 必须显式配置。
    secret: ${JWT_SECRET_APP:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS_APP:86400}
    restricted-expiration-seconds: ${JWT_RESTRICTED_EXPIRATION_SECONDS_APP:1800}
    audience: app-bff

passenger:
  internal-auth:
    token: ${PASSENGER_INTERNAL_TOKEN:dev-passenger-internal-change-me}
  ws:
    # 运维总闸：false 时拒绝 ws-token / WS 握手
    enabled: ${PASSENGER_WS_ENABLED:true}
    heartbeat-timeout-ms: 90000

order:
  lifecycle:
    internal-auth:
      token: ${ORDER_LIFECYCLE_INTERNAL_TOKEN:dev-order-lifecycle-change-me}
      connect-timeout-ms: ${ORDER_LIFECYCLE_CONNECT_TIMEOUT_MS:300}
      read-timeout-ms: ${ORDER_LIFECYCLE_READ_TIMEOUT_MS:800}

coupon:
  claim-identity:
    phone-hash-secret: ${COUPON_CLAIM_IDENTITY_PHONE_HASH_SECRET:}

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs/passenger-api

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://127.0.0.1:9411/api/v2/spans

services:
  order:
    base-url: http://127.0.0.1:8093
  passenger:
    base-url: http://127.0.0.1:8092
  capacity:
    base-url: http://127.0.0.1:8090
  calculate:
    base-url: http://127.0.0.1:8091
  wallet:
    base-url: http://127.0.0.1:8095
  map:
    base-url: http://127.0.0.1:8094
