spring:
  datasource:
    url: jdbc:h2:mem:calculate_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

benefit:
  sign-in:
    enabled: true
    timezone: Asia/Shanghai
    cycle: MONTHLY
    display-days: 28
    sign-days:
      start-day-of-month: 1
      end-day-of-month: 28
    rewards:
      default:
        points: 5
      continuous:
        - every-days: 7
          points: 35
          include-default: false

calculate:
  lifecycle:
    messaging:
      enabled: false
    internal-auth:
      token: dev-order-lifecycle-change-me
    write-fence:
      mode: SHADOW
