server:
  port: 8091

spring:
  application:
    name: calculate-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/calculate?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      test-while-idle: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

benefit:
  sign-in:
    enabled: true
    timezone: Asia/Shanghai
    cycle: MONTHLY
    display-days: 28
    sign-days:
      start-day-of-month: 1
      end-day-of-month: 28
    rewards:
      default:
        points: 5
      continuous:
        - every-days: 7
          points: 35
          include-default: false

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs/calculate-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.sx.calculate.dao: DEBUG

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.sx.calculate.dao: DEBUG
