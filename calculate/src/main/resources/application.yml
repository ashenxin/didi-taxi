server:
  port: 8091

spring:
  application:
    name: calculate-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: ${ACCOUNT_LIFECYCLE_CALCULATE_GROUP:calculate-account-lifecycle-command-v1}
      auto-offset-reset: earliest
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/calculate?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&autoReconnect=true&useSSL=false&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1
      test-while-idle: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}

benefit:
  sign-in:
    enabled: true
    timezone: Asia/Shanghai
    cycle: MONTHLY
    display-days: 28
    sign-days:
      start-day-of-month: 1
      end-day-of-month: 28
    rewards:
      default:
        points: 5
      continuous:
        - every-days: 7
          points: 35
          include-default: false

calculate:
  lifecycle:
    messaging:
      enabled: ${ACCOUNT_LIFECYCLE_KAFKA_ENABLED:true}
      command-topic: ${ACCOUNT_LIFECYCLE_COMMAND_TOPIC:account.lifecycle.command.v1}
      result-topic: ${ACCOUNT_LIFECYCLE_RESULT_TOPIC:account.lifecycle.result.v1}
      event-topic: ${ACCOUNT_LIFECYCLE_EVENT_TOPIC:account.lifecycle.event.v1}
    internal-auth:
      # 优先使用通用生命周期 Token；迁移期兼容已配置的 Order 生命周期 Token。
      token: ${ACCOUNT_LIFECYCLE_INTERNAL_TOKEN:${ORDER_LIFECYCLE_INTERNAL_TOKEN:dev-order-lifecycle-change-me}}
    write-fence:
      # P6 接通持续投影并完成覆盖率核验前保持 SHADOW。
      mode: ${CALCULATE_LIFECYCLE_WRITE_FENCE_MODE:SHADOW}

logging:
  config: classpath:logback-spring.xml
  file:
    path: ./logs/calculate-service

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:mapper/**/*.xml

xxl:
  job:
    enabled: ${XXL_JOB_CALCULATE_ENABLED:false}
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8081/xxl-job-admin}
    executor:
      appname: calculate-executor
      address: ${XXL_JOB_CALCULATE_EXECUTOR_ADDRESS:http://127.0.0.1:9996}
      port: 9996
      log-path: ./logs/xxl-job
      log-retention-days: 7

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.sx.calculate.dao: DEBUG

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.sx.calculate.dao: DEBUG
